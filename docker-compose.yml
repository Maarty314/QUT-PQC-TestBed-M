services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pqc-server
    hostname: server
    volumes:
      - ./server/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/app/certs
      - ./results:/app/results
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      pqc-net:
        ipv4_address: 172.28.0.10

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pqc-client
    hostname: client
    depends_on:
      - server
    volumes:
      - ./client/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/app/certs
      - ./results:/app/results
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      pqc-net:
        ipv4_address: 172.28.0.11

  client2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pqc-client2
    hostname: client2
    depends_on:
      - server
    volumes:
      - ./client2/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/app/certs
      - ./results:/app/results
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      pqc-net:
        ipv4_address: 172.28.0.13

  client3:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pqc-client3
    hostname: client3
    depends_on:
      - server
    volumes:
      - ./client3/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/app/certs
      - ./results:/app/results
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      pqc-net:
        ipv4_address: 172.28.0.14

  client4:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pqc-client4
    hostname: client4
    depends_on:
      - server
    volumes:
      - ./client4/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/app/certs
      - ./results:/app/results
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      pqc-net:
        ipv4_address: 172.28.0.15

